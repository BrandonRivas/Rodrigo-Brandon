<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preload" as="image" href="Images/Background.jpg" />
    <title>Rodrigo & Brandon — Save the Date</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Aboreto&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💍</text></svg>"
    />
  </head>
  <body>
    <div class="enter-screen" id="enter-screen">
      <p><img src="Images/Subtract.svg" alt="" /></p>
    </div>
    <audio id="wind" autoplay loop>
      <source src="Sound/Wind.m4a" type="audio/mp4" />
    </audio>
    <audio id="background" autoplay loop>
      <source src="Sound/Amor Prohibido.mp3" type="audio/mpeg" />
    </audio>
    <div class="banner">
      <img src="Images/Papel_2.svg" alt="" />
      <img src="Images/Papel_1.svg" alt="" />
      <img src="Images/Papel_2.svg" alt="" />
      <img src="Images/Papel_3.svg" alt="" />
      <img src="Images/Papel_4.svg" alt="" />
      <img src="Images/Papel_5.svg" alt="" />
      <img src="Images/Papel_6.svg" alt="" />
      <img src="Images/Papel_7.svg" alt="" />
      <img src="Images/Papel_2.svg" alt="" />
    </div>
    <div class="content">
      <div class="names">
        Rodrigo
        <span class="and">and</span>
        Brandon
      </div>
      <div class="details">
        October 9th, 2027 <br />
        Querétaro, Mexico
      </div>

      <div class="tagline">
        <span class="label">Save the Date</span>
        <span>We can't wait to celebrate with you!</span>
      </div>
    </div>
    <div class="lang-switcher">
      <button onclick="setLang('en')">EN</button>
      <button onclick="setLang('fr')">FR</button>
      <button onclick="setLang('es')">ES</button>
    </div>
    <!-- prettier-ignore -->
    <script>
        const bgMusic = document.getElementById("wind");  
  const background = document.getElementById("background"); 
  bgMusic.volume = 0.3;
  background.volume = 0;                 
                                         
  let audioStarted = false;              
                                         
  document.addEventListener("click", () => {            
    if (audioStarted) return;            
    audioStarted = true;  
        document.getElementById("enter-screen").style.display = "none";             
    bgMusic.play();                      
    background.play();                                
    let volume = 0;                      
    setTimeout(() => {                   
      const fadeIn = setInterval(() => { 
        if (volume < 0.3) {              
          volume += 0.01;                
          background.volume = volume;    
        } else {                         
          clearInterval(fadeIn);         
        }                                
      }, 1000);   
    }, 700);                            
  });

      const translations = {
        en: {
          and: "and",
          date: "October 9th, 2027",
          location: "Querétaro, Mexico",
          saveTheDate: "Save the Date",
          tagline: "We can't wait to celebrate with you!",
        },
        fr: {
          and: "et",
          date: "9 octobre 2027",
          location: "Querétaro, Mexique",
          saveTheDate: "Réservez la date",
          tagline: "Nous avons hâte de célébrer avec vous !",
        },
        es: {
          and: "y",
          date: "9 de octubre de 2027",
          location: "Querétaro, México",
          saveTheDate: "Reserva la fecha",
          tagline: "¡Tenemos muchas ganas de celebrar contigo!",
        },
      };

      function setLang(lang) {
        const t = translations[lang];
        document.querySelector(".and").textContent = t.and;
        document.querySelector(".details").innerHTML = `${t.date} <br /> ${t.location}`;
        document.querySelector(".tagline").innerHTML = `<span class="label">${t.saveTheDate}</span> <span>${t.tagline}</span>`;
      }

      const browserLang = navigator.language.slice(0, 2);
      if (translations[browserLang]) {
        setLang(browserLang);
      } else {
        setLang("en");
      }
    </script>
  </body>
</html>
